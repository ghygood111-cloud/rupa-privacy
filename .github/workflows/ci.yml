name: CI

on:
  push:
  pull_request:

jobs:
  portable:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install ".[test,demo,research]" "matplotlib>=3.5,<3.10"
      - name: Portable scientific-contract tests
        run: python -m pytest -m "not slow and not locked_regression"
      - name: CLI smoke tests
        run: |
          python -m rupa_privacy --help
          python -m rupa_privacy version
      - name: Official example validation
        run: |
          python -m rupa_privacy generate-example --output ci_example
          python -m rupa_privacy validate --calibration ci_example/calibration.csv --release ci_example/release.csv --config ci_example/config.yaml

  locked-regression:
    name: Locked SoftwareX regression / Windows / Python 3.9
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install exact reproduction dependencies
        run: |
          python -m pip install -r reproducibility/requirements-validation-py39.txt
          python -m pip install .
      - name: Full tests including exact and resource tests
        run: python -m pytest
      - name: SoftwareX reproduction
        run: python reproducibility/run_all.py
